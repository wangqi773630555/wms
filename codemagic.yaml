workflows:
  flutter-ios-unsigned:
    name: Flutter iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # 锁定 Flutter 版本：stable 是浮动通道，升级到 3.35+ 后会在构建时自动迁移 iOS 工程，
      # 往 Podfile 注入 RunnerTests target，而本老项目 pbxproj 没有该 target，导致 pod install 失败。
      flutter: 3.29.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Rebuild plugin symlinks and clean Pods cache
        script: |
          # 删除可能过期的插件软链接与 Pods 缓存，避免旧的 FFI 版插件残留
          rm -rf ios/.symlinks ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          # 兜底：移除任何被缓存或 Flutter 迁移注入的 RunnerTests target。
          # 本工程 pbxproj 没有该 target，残留会导致 "Unable to find a target named RunnerTests"。
          perl -0pi -e "s/\n\s*target 'RunnerTests' do.*?\n\s*end\n/\n/s" ios/Podfile
          grep -n "RunnerTests" ios/Podfile && echo "ERROR: RunnerTests still present" && exit 1 || true
          cd ios && pod install

      - name: Build iOS release without code signing
        script: |
          # flutter build 内部会再跑一次 pod install，构建前再清一次确保干净
          perl -0pi -e "s/\n\s*target 'RunnerTests' do.*?\n\s*end\n/\n/s" ios/Podfile
          flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        script: |
          set -e
          cd build/ios/iphoneos
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -type d | head -n 1 | sed 's|^\./||')
          echo "APP_NAME=$APP_NAME"
          mkdir -p Payload
          cp -R "$APP_NAME" Payload/
          zip -qr myapp.ipa Payload
          ls -lh myapp.ipa

    artifacts:
      - build/ios/iphoneos/myapp.ipa
