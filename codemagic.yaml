workflows:
  flutter-ios-unsigned:
    name: Flutter iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # 锁定 Flutter 版本：stable 是浮动通道，升级到 3.35+ 后会在构建时自动迁移 iOS 工程，
      # 往 Podfile 注入 RunnerTests target，而本老项目 pbxproj 没有该 target，导致 pod install 失败。
      flutter: 3.29.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Rebuild plugin symlinks and clean Pods cache
        script: |
          # 删除可能过期的插件软链接与 Pods 缓存，避免旧的 FFI 版插件残留
          rm -rf ios/.symlinks ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS release without code signing
        script: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        script: |
          set -e
          cd build/ios/iphoneos
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -type d | head -n 1 | sed 's|^\./||')
          echo "APP_NAME=$APP_NAME"
          mkdir -p Payload
          cp -R "$APP_NAME" Payload/
          zip -qr myapp.ipa Payload
          ls -lh myapp.ipa

    artifacts:
      - build/ios/iphoneos/myapp.ipa
