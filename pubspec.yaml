  shared_preferences: ^2.5.3
  flutter_redux: ^0.8.0
  #轮播
  flutter_swiper_null_safety: ^1.0.2
  #加载框样式
  flutter_spinkit: ^5.0.0
  #网络框架
  dio: ^4.0.6
  #cookie_jar: ^3.0.0
  dio_cookie_manager: ^2.0.0
  #connectivity: ^3.0.0
  #事件分发
  event_bus:  ^2.0.0
  #土司
  fluttertoast: ^8.2.8
  #数据库
  # sqflite: ^2.0.0
  #相册与拍照
  image_picker: ^1.2.1
  #uri
  url_launcher: ^6.3.1
