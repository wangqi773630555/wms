  #flutter_cache_manager: ^3.0.0
  #时间格式
  date_format: ^2.0.0
  #选择器
  #flutter_picker: ^2.0.5
  #图表
  #fl_chart: ^0.9.0
  #包信息
  package_info_plus: ^8.3.0
  #扫码
  barcode_scan2: ^4.5.0
  #刷新
  flutter_easyrefresh: ^2.2.2
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  open_file: ^3.2.1
  file_picker: ^9.0.2
  flutter_cupertino_datetime_picker: ^3.0.0
  #find_dropdown: ^1.0.0
  #jishu

  flutter_switch: ^0.3.1
  #package_info: ^2.0.2
  #图片缓存
  cached_network_image: ^3.3.1
